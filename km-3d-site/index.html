<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Karachi Marathon Race Village 3D</title>
<meta name="description" content="Interactive 3D layout of the Karachi Marathon race village and route.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/cesium@1.120.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

<style>
:root{--bg:rgba(9,12,15,.86);--line:rgba(255,255,255,.1);--tx:#eef2f1;--mu:#93a19d;--ac:#7fe3c9;--ac2:#2bb594}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0a0d10;color:var(--tx);font-family:Archivo,system-ui,sans-serif;overflow:hidden}
#c{position:absolute;inset:0}
.cesium-viewer-bottom{left:auto!important;right:8px!important;bottom:4px!important}
.cesium-widget-credits{font-size:10px}
button{font:inherit;color:inherit;cursor:pointer}
#panel{position:absolute;top:16px;left:16px;width:300px;max-height:calc(100% - 32px);display:flex;flex-direction:column;background:var(--bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;overflow:hidden;z-index:5}
#panel header{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.kick{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);font-weight:600}
h1{margin:4px 0 2px;font-size:21px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.sub{font-size:12.5px;color:var(--mu)}
.acts{display:flex;gap:6px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.btn{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;font-weight:600}
.btn:hover{background:rgba(255,255,255,.13)}
.btn.pri{background:var(--ac);color:#06201a;border-color:var(--ac)}
.btn.pri:hover{background:#9ef0da}
.btn.on{border-color:var(--ac);color:var(--ac)}
#list{overflow:auto;padding:6px 8px 12px}
.grp{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);padding:12px 8px 4px;font-weight:600}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;font-size:13.5px}
.item:hover,.item.sel{background:rgba(127,227,201,.12)}
.dot{width:9px;height:9px;border-radius:3px;flex:none}
.toggles{display:flex;gap:6px;padding:0 16px 12px;flex-wrap:wrap}
#card{position:absolute;right:16px;top:16px;width:320px;background:var(--bg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:14px;padding:16px 18px;z-index:5;display:none}
#card h2{margin:4px 0 8px;font-size:19px;font-weight:800}
#card p{margin:0 0 10px;font-size:13.5px;line-height:1.5;color:#cfd8d5}
.meta{display:flex;gap:16px;font-size:12px;color:var(--mu)}
.meta b{display:block;color:var(--tx);font-size:14px;font-weight:600}
.x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--mu);font-size:20px}
#cap{position:absolute;left:50%;bottom:34px;transform:translateX(-50%);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 18px;max-width:min(560px,calc(100% - 32px));z-index:6;display:none;text-align:center}
#cap .kick{display:block;margin-bottom:3px}
#cap span.t{font-size:15px;font-weight:600}
#cap .bar{height:2px;background:rgba(255,255,255,.1);margin-top:10px;border-radius:2px;overflow:hidden}
#cap .bar i{display:block;height:100%;width:0;background:var(--ac)}
#loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:#0a0d10;z-index:20;transition:opacity .6s}
#loader .ring{width:38px;height:38px;border:3px solid rgba(127,227,201,.2);border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite}
#loader .msg{font-size:13px;color:var(--mu);max-width:420px;text-align:center;padding:0 16px}
@keyframes sp{to{transform:rotate(360deg)}}
#mtoggle{display:none}
.credit{font-size:10.5px;color:var(--mu);padding:8px 16px 12px;border-top:1px solid var(--line);line-height:1.4}.credit a{color:var(--mu)}
@media (max-width:720px){
 #panel{top:auto;bottom:0;left:0;right:0;width:auto;max-height:52%;border-radius:14px 14px 0 0}
 #panel.min #list,#panel.min .toggles{display:none}
 #mtoggle{display:inline-block;margin-left:auto}
 #card{left:12px;right:12px;width:auto;top:12px}
 #cap{bottom:auto;top:12px}
 h1{font-size:18px}
}
</style>
</head>

<div id="loader"><div class="ring"></div><div class="msg" id="lmsg">Loading 3D city of Karachi…</div></div>

  <button class="btn" id="mtoggle">☰</button>

</aside>

/* ---------- ground heights ---------- */
const G = {};
async function sampleGround() {
 const pts = [], idx = [];

 for (const k in CFG) {
  const z = CFG[k];
  if (z.poly) { push(k, z.lon, z.lat); const fr = new Frame(z.lon, z.lat, 0, z.brg); [[.3, .3], [-.3, .3], [.3, -.3], [-.3, -.3]].forEach(([a, b]) => { const [lo, la] = fr.ll(a * z.len, b * z.wid); push(k, lo, la); }); }
 }
 const [a, b] = CFG.arch.line; push('arch', (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); push('arch', a[0], a[1]); push('arch', b[0], b[1]);
 CFG.entries.forEach((p, i) => push('entry' + i, p[0], p[1]));
 CFG.pixel.forEach((p, i) => push('pixel' + i, p[0], p[1]));

 if (!OFF) {
  try {
   res = await Promise.race([scene.sampleHeightMostDetailed(pts), new Promise(r => setTimeout(() => r(null), 25000))]);
  } catch (e) { console.warn('sample failed', e); }
 }
 const by = {};
 if (res) res.forEach((c, i) => { (by[idx[i]] = by[idx[i]] || []).push(c && c.height); });
 const all = res ? median(res.map(c => c && c.height)) : NaN;
 const base = OFF ? 0 : (Number.isFinite(all) ? all : -38);
 for (const k of new Set(idx)) {
  let h = by[k] ? median(by[k]) : NaN;
  if (!Number.isFinite(h) || Math.abs(h - base) > 2.5) h = base;
  G[k] = h;
 }
 G._base = base;
 console.log('ground', G);
}

  if (tot > best.n) best = {n: tot, y, runs};
 }
 (best.runs || []).forEach(r => stallRow(fr, (r[0] + r[r.length - 1]) / 2, best.y, r.length, uw, d, 'SPONSOR'));
 return {f: fr, top: 4};
}

function buildFood() {
 ZONE = 'food'; const z = CFG.food, fr = zf('food'), g = G.food, P = z.poly, kx = 111320 * Math.cos(z.lat * D2R), ky = 110574;
 const loc = ([lo, la]) => [(lo - z.lon) * kx, (la - z.lat) * ky], geo = ([e, n]) => [z.lon + e / kx, z.lat + n / ky];
 const Q = P.map(loc), placed = [];
 // stalls follow the boundary, inset and facing the centre
 for (let i = 0; i < Q.length; i++) {
  const a = Q[i], b = Q[(i + 1) % Q.length], len = Math.hypot(b[0] - a[0], b[1] - a[1]);
  for (let t = 1.8; t < len; t += 3.5) {
   const p = [a[0] + (b[0] - a[0]) * t / len, a[1] + (b[1] - a[1]) * t / len], m = Math.hypot(p[0], p[1]) || 1;
   const c = [p[0] - p[0] / m * 2.1, p[1] - p[1] / m * 2.1];
   if (placed.some(q => Math.hypot(q[0] - c[0], q[1] - c[1]) < 3.5)) continue;
   const face = Math.atan2(-c[0], -c[1]) / D2R, hb = face + 90;
   const cf = new Frame(...geo(c), 0, hb);
   if (![[1.5, 1.5], [-1.5, -1.5], [1.5, -1.5], [-1.5, 1.5]].every(([u, v]) => pip(cf.ll(u, v), P))) continue;
   placed.push(c); const ll = geo(c); hut(ll[0], ll[1], g, hb, 3, 3, 'FOOD STALL');
  }
 }
 const near = (x, y) => { const ll = fr.ll(x, y), q = loc(ll); return placed.some(c => Math.hypot(c[0] - q[0], c[1] - q[1]) < 3.6); };
 const L = z.len, W = z.wid;
 for (let x = -L / 2 + 2; x <= L / 2 - 2; x += 3.8) for (let y = -W / 2 + 2; y <= W / 2 - 2; y += 3.8)
  if (pip(fr.ll(x, y), P) && !near(x, y)) { cyl(fr, x, y, 0, .75, .55, .55, WHITE, 16); cyl(fr, x, y, 2.2, .05, 1.3, 1.3, col('#f8fafc'), 16); cyl(fr, x, y, .75, 1.5, .03, .03, STEEL, 6); }
 return {f: fr, top: 4};
}

function buildSmall() {
 ZONE = 'zerrita'; { const z = CFG.zerrita; hut(z.lon, z.lat, G.zerrita, z.brg, 4, 3.6, 'ZERRITA', '#be185d'); }
 ZONE = 'shehzar'; { const z = CFG.shehzar; hut(z.lon, z.lat, G.shehzar, z.brg, 4.4, 3, 'SHEHZAR · ART', '#7e22ce'); }
 ZONE = 'pixel';
 CFG.pixel.forEach((p, i) => {
  const fr = new Frame(p[0], p[1], G['pixel' + i], 0);
  box(fr, 0, 0, 0, 1.2, .6, 2.2, col('#1b1d21'));
  const t = tex('pix', [{t: 'CHARGE', s: .32, c: '#c4b5fd'}], {w: 256, h: 128, bg: '#1b1d21'});
  banner(fr, 0, .31, 1.6, 1.1, .55, t, 1); banner(fr, 0, -.31, 1.6, 1.1, .55, t, -1);
 });
 ZONE = 'entries';
 CFG.entries.forEach((p, i) => {
  const fr = new Frame(p[0], p[1], G['entry' + i], 138);
  [-3.3, 3.3].forEach(x => truss(fr, x, 0, 0, 'z', 4.4, .35));
  box(fr, 0, 0, 3.4, 7, .5, .9, BLACK);
  const t = tex('gate', [{t: 'ENTRY  ·  EXIT', s: .5, c: AC}], {w: 1024, h: 128});
  banner(fr, 0, .27, 3.85, 6.4, .75, t, 1); banner(fr, 0, -.27, 3.85, 6.4, .75, t, -1);
 });
}

/* ---------- footprints, labels, route ---------- */
const FOOT = {byd_zone: 'byd_zone', stage: 'stage', audience: 'audience', vip_deck: 'vip_deck', byd_deck: 'byd_deck', bleach1: 'bleach1', bleach2: 'bleach2', media: 'media', food: 'food', sponsors: 'sponsors', lounge: 'lounge', byd_lounge: 'byd_lounge', zerrita: 'zerrita', shehzar: 'shehzar'};
function buildFootprints() {
 for (const k in FOOT) {
  const z = CFG[k], zz = ZK[k];
  const e = F.entities.add({polygon: {hierarchy: C.Cartesian3.fromDegreesArray(z.poly.flat()), material: col(zz.c, .28), classificationType: C.ClassificationType.BOTH}});
  e.zone = k;
 }
}
const SMALL = new Set(['vip_deck', 'media', 'pixel', 'zerrita', 'shehzar', 'entries', 'lounge']);
function labelAt(k, lon, lat, h, text) {
 const pos = C.Cartesian3.fromDegrees(lon, lat, h);
 const e = LBL.entities.add({position: pos,
  label: {text, font: '600 14px Archivo, Arial, sans-serif', fillColor: C.Color.WHITE, showBackground: true,
   backgroundColor: col('#090c0f', .82), backgroundPadding: new C.Cartesian2(9, 6), verticalOrigin: C.VerticalOrigin.BOTTOM,
   pixelOffset: new C.Cartesian2(0, -10), disableDepthTestDistance: Number.POSITIVE_INFINITY,
   distanceDisplayCondition: new C.DistanceDisplayCondition(0, SMALL.has(k) ? 300 : 2200), scaleByDistance: new C.NearFarScalar(200, 1, 2000, .72)},
  point: {pixelSize: 8, color: col(ZK[k] ? ZK[k].c : AC), outlineColor: C.Color.WHITE, outlineWidth: 2, disableDepthTestDistance: Number.POSITIVE_INFINITY,
   distanceDisplayCondition: new C.DistanceDisplayCondition(0, 2200)}});
 e.zone = k; return e;
}
let ROUTE_PTS = [];
function buildRoute() {
 const r = CFG.route; ROUTE_PTS = r;
 const h = G._base;
 const pos = C.Cartesian3.fromDegreesArray(r.flat());
 const e = RT.entities.add({polyline: {positions: pos, width: 7, clampToGround: true, material: col(AC, .95), classificationType: C.ClassificationType.BOTH}});
 e.zone = 'route';
 // km markers
 let acc = 0, next = 1000;
 for (let i = 1; i < r.length; i++) {
  const [, d] = bearing(r[i - 1], r[i]);
  while (acc + d >= next) {
   const f = (next - acc) / d, lon = r[i - 1][0] + f * (r[i][0] - r[i - 1][0]), lat = r[i - 1][1] + f * (r[i][1] - r[i - 1][1]);
   const m = RT.entities.add({position: C.Cartesian3.fromDegrees(lon, lat, h + 6),
    label: {text: (next / 1000) + ' km', font: '700 13px Archivo, Arial, sans-serif', fillColor: col('#06201a'), showBackground: true, backgroundColor: col(AC, .95),
     backgroundPadding: new C.Cartesian2(7, 4), disableDepthTestDistance: Number.POSITIVE_INFINITY,
     distanceDisplayCondition: new C.DistanceDisplayCondition(0, 16000), scaleByDistance: new C.NearFarScalar(500, 1, 12000, .6)}});
   m.zone = 'route'; next += 1000;
  }
  acc += d;
 }
 const u = CFG.uturn;
 const ue = RT.entities.add({position: C.Cartesian3.fromDegrees(u[0], u[1], (G.uturn ?? h) + 8),
  label: {text: 'U-TURN · 10.5 km', font: '800 14px Archivo, Arial, sans-serif', fillColor: C.Color.WHITE, showBackground: true, backgroundColor: col('#e11d48', .95),
   backgroundPadding: new C.Cartesian2(9, 5), disableDepthTestDistance: Number.POSITIVE_INFINITY, distanceDisplayCondition: new C.DistanceDisplayCondition(0, 20000)}});
 ue.zone = 'route';
}

/* ---------- camera ---------- */
const CENTER = {};
function sphereOf(k) {
 if (k === 'route') return C.BoundingSphere.fromPoints(C.Cartesian3.fromDegreesArray(CFG.route.flat(), C.Ellipsoid.WGS84).map(p => { const c = C.Cartographic.fromCartesian(p); return C.Cartesian3.fromRadians(c.longitude, c.latitude, G._base); }));
 return new C.BoundingSphere(CENTER[k], 6);
}
function flyZone(k, dur = 2.2) {
 const z = ZK[k]; const sph = sphereOf(k);
 const range = k === 'route' ? sph.radius * 2.3 : z.r;
 return new Promise(res => viewer.camera.flyToBoundingSphere(sph, {offset: new C.HeadingPitchRange(z.h * D2R, z.p * D2R, range), duration: dur, complete: res, cancel: res}));
}
function overview(dur = 2.4) {
 const c = C.Cartesian3.fromDegrees(67.03605, 24.79795, G._base || 0);
 return new Promise(res => viewer.camera.flyToBoundingSphere(new C.BoundingSphere(c, 10), {offset: new C.HeadingPitchRange(222 * D2R, -34 * D2R, 330), duration: dur, complete: res, cancel: res}));
}

/* ---------- UI ---------- */
const $ = id => document.getElementById(id);
function buildList() {
 const groups = {Race: 'Race', BYD: 'BYD', Village: 'Race Village'};
 let html = '';
 for (const g in groups) {
  html += `<div class="grp">${groups[g]}</div>`;
  ZONES.filter(z => z.g === g).forEach(z => { html += `<button class="item" data-k="${z.k}"><span class="dot" style="background:${z.c}"></span>${z.n}</button>`; });
 }
 $('list').innerHTML = html;
 $('list').querySelectorAll('.item').forEach(b => b.onclick = () => { stopTour(); select(b.dataset.k, true); if (innerWidth < 720) $('panel').classList.add('min'); });
}
function showCard(k) {
 const z = ZK[k]; if (!z) return;
 $('cg').textContent = z.g === 'Village' ? 'Race Village' : z.g;
 $('ct').textContent = z.n; $('cd').textContent = z.d;
 const c = CFG[k]; let meta = '';
 if (c && c.len) meta += `<div><b>≈ ${Math.round(c.len)} × ${Math.round(c.wid)} m</b>footprint</div>`;
 if (k === 'route') meta += `<div><b>21.1 km</b>out and back</div><div><b>10.5 km</b>to U-turn</div>`;
 if (k === 'byd_zone') meta += `<div><b>6</b>cars on display</div>`;
 if (k === 'pixel' || k === 'entries') meta += `<div><b>2</b>locations</div>`;
 $('cm').innerHTML = meta; $('card').style.display = 'block';
}
function select(k, fly) {
 document.querySelectorAll('.item').forEach(b => b.classList.toggle('sel', b.dataset.k === k));
 showCard(k); if (fly) return flyZone(k);
}
$('cx').onclick = () => { $('card').style.display = 'none'; document.querySelectorAll('.item').forEach(b => b.classList.remove('sel')); };
$('bOver').onclick = () => { stopTour(); overview(); };
$('bRoute').onclick = () => { stopTour(); select('route', true); };
$('mtoggle').onclick = () => $('panel').classList.toggle('min');
function tog(id, ds) { $(id).onclick = () => { ds.show = !ds.show; $(id).classList.toggle('on', ds.show); }; }
tog('tLab', LBL); tog('tFoot', F); tog('tRoute', RT);

viewer.screenSpaceEventHandler.setInputAction(m => {
 const p = scene.pick(m.position);
 if (p && p.id && p.id.zone) { stopTour(); select(p.id.zone, false); }
}, C.ScreenSpaceEventType.LEFT_CLICK);

/* ---------- tour ---------- */
const TOUR = [
 ['arch', 'Start and finish under the BYD arch'],
 ['byd_deck', 'BYD and VIP decks sit right on the finish line'],
 ['bleach1', 'Spectator bleachers line the finish straight'],
 ['byd_zone', 'The BYD Experience Zone, centre of the village'],
 ['byd_lounge', 'BYD Lounge for guests and test-drive sign-ups'],
 ['stage', 'Main stage with audience seating'],
 ['sponsors', "Sponsors' activation row"],
 ['food', 'Food area'],
 ['route', 'The course: out along the coast to the 10.5 km U-turn']
];
let touring = false, orbitH = null;
function orbit(k, ms) {
 return new Promise(res => {
  const z = ZK[k], sph = sphereOf(k), t0 = performance.now();
  const range = k === 'route' ? sph.radius * 2.3 : z.r;
  let h = z.h * D2R;
  const step = () => {
   if (!touring) { viewer.camera.lookAtTransform(C.Matrix4.IDENTITY); return res(); }
   const t = performance.now() - t0; $('capb').style.width = Math.min(100, t / ms * 100) + '%';
   h += k === 'route' ? 0.0006 : 0.0022;
   viewer.camera.lookAt(sph.center, new C.HeadingPitchRange(h, z.p * D2R, range));
   if (t < ms) orbitH = requestAnimationFrame(step); else { viewer.camera.lookAtTransform(C.Matrix4.IDENTITY); res(); }
  };
  orbitH = requestAnimationFrame(step);
 });
}
async function playTour() {
 touring = true; $('bTour').textContent = '■ Stop tour'; $('cap').style.display = 'block'; $('card').style.display = 'none';
 for (let i = 0; i < TOUR.length && touring; i++) {
  const [k, t] = TOUR[i];
  $('capk').textContent = `${i + 1} / ${TOUR.length} · ${ZK[k].n}`; $('capt').textContent = t; $('capb').style.width = '0';
  await flyZone(k, k === 'route' ? 3.2 : 2.4); if (!touring) break;
  await orbit(k, k === 'route' ? 6500 : 5200);
 }
 if (touring) await overview();
 stopTour();
}
function stopTour() {
 touring = false; if (orbitH) cancelAnimationFrame(orbitH); viewer.camera.lookAtTransform(C.Matrix4.IDENTITY);
 $('bTour').textContent = '▶ Play tour'; $('cap').style.display = 'none';
}
$('bTour').onclick = () => touring ? stopTour() : playTour();
['wheel', 'pointerdown', 'touchstart'].forEach(ev => $('c').addEventListener(ev, () => { if (touring) stopTour(); }, {passive: true}));

/* ---------- init ---------- */
(async function init() {
 try {
  viewer.camera.setView({destination: C.Cartesian3.fromDegrees(67.0395, 24.8005, 450), orientation: {heading: 222 * D2R, pitch: -34 * D2R, roll: 0}});
  if (!OFF) {
   C.GoogleMaps.defaultApiKey = GKEY;
   const ts = await C.createGooglePhotorealistic3DTileset();
   scene.primitives.add(ts);
   $('lmsg').textContent = 'Placing the race village on the ground…';
   await new Promise(r => { const ok = () => { ts.allTilesLoaded.removeEventListener(ok); r(); }; ts.allTilesLoaded.addEventListener(ok); setTimeout(r, 9000); });
  }
  try { await document.fonts.load('800 40px Archivo'); } catch (e) {}
  await sampleGround();
  const tops = {};
  tops.arch = buildArch();
  tops.byd_deck = buildDeck('byd_deck', 'BYD', AC, false);
  tops.vip_deck = buildDeck('vip_deck', 'VIP', '#f2c14e', false);
  tops.media = buildDeck('media', 'MEDIA', '#ffffff', true);
  tops.bleach1 = buildBleachers('bleach1'); tops.bleach2 = buildBleachers('bleach2');
  tops.stage = buildStage(); buildAudience();
  tops.byd_zone = buildBydZone();
  tops.byd_lounge = buildMarquee('byd_lounge', 'BYD LOUNGE', AC);
  tops.lounge = buildMarquee('lounge', 'LOUNGE', '#facc15', .85, .85);
  tops.sponsors = buildSponsorRow();
  tops.food = buildFood();
  buildSmall();
  buildFootprints(); buildRoute();
  // centres + labels
  for (const z of ZONES) {
   let lon, lat, top = 5, g = G[z.k];
   if (z.k === 'arch') { const [a, b] = CFG.arch.line; lon = (a[0] + b[0]) / 2; lat = (a[1] + b[1]) / 2; top = 8; }
   else if (z.k === 'pixel') { [lon, lat] = CFG.pixel[0]; g = G.pixel0; top = 2.5; }
   else if (z.k === 'entries') { [lon, lat] = CFG.entries[0]; g = G.entry0; top = 4.5; }
   else if (z.k === 'route') continue;
   else { lon = CFG[z.k].lon; lat = CFG[z.k].lat; top = (tops[z.k] && tops[z.k].top) || 3; }
   g = Number.isFinite(g) ? g : G._base;
   CENTER[z.k] = C.Cartesian3.fromDegrees(lon, lat, g + top * .5);
   labelAt(z.k, lon, lat, g + top + 3, z.n);
   if (z.k === 'pixel') labelAt('pixel', CFG.pixel[1][0], CFG.pixel[1][1], G.pixel1 + 5.5, z.n);
   if (z.k === 'entries') labelAt('entries', CFG.entries[1][0], CFG.entries[1][1], G.entry1 + 7.5, z.n);
  }
  buildList();
  $('loader').style.opacity = 0; setTimeout(() => $('loader').remove(), 700);
  overview(3);
  window.__ready = true;
 } catch (e) {
  console.error(e);
  $('lmsg').innerHTML = 'Could not load the 3D map.<br><small>' + (e && e.message ? e.message : e) + '</small>';
  document.querySelector('#loader .ring').style.display = 'none';
 }
})();
